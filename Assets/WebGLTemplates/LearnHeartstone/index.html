<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Learn Heartstone · 酒馆战棋训练场</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
      <div id="unity-rotate-prompt">请旋转设备</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var mobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b91c1c; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      config.devicePixelRatio = mobileDevice
        ? Math.min(window.devicePixelRatio || 1, 1.25)
        : Math.min(window.devicePixelRatio || 1, 2);

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      function resizeUnityCanvas() {
        var portraitMobile = mobileDevice && window.innerHeight > window.innerWidth;
        container.classList.toggle("requires-landscape", portraitMobile);
        if (portraitMobile) return;

        var availableWidth = document.documentElement.clientWidth;
        var availableHeight = document.documentElement.clientHeight;
        var width = Math.min(availableWidth, availableHeight * (16 / 9));
        var height = width * (9 / 16);
        canvas.style.width = Math.floor(width) + "px";
        canvas.style.height = Math.floor(height) + "px";
      }

      resizeUnityCanvas();
      window.addEventListener("resize", resizeUnityCanvas);
      window.addEventListener("orientationchange", resizeUnityCanvas);
      document.addEventListener("fullscreenchange", resizeUnityCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeUnityCanvas);
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      async function resolveChunkedDataUrl(dataUrl, onProgress) {
        var chunkManifestSuffix = ".data.br.chunks.json";
        if (!dataUrl.endsWith(".data.br")) return null;

        var manifestUrl = dataUrl + ".chunks.json";
        if (!manifestUrl.endsWith(chunkManifestSuffix)) return null;
        var manifestResponse = await fetch(manifestUrl, { cache: "no-cache" });
        if (manifestResponse.status === 404) return null;
        if (!manifestResponse.ok) {
          throw new Error("Data chunk manifest request failed: " + manifestResponse.status);
        }

        var manifest = await manifestResponse.json();
        if (manifest.schemaVersion !== 1 ||
            !dataUrl.endsWith(manifest.originalFile) ||
            !Array.isArray(manifest.chunks) ||
            manifest.chunks.length === 0 ||
            !Number.isSafeInteger(manifest.uncompressedBytes) ||
            manifest.uncompressedBytes <= 0) {
          throw new Error("Invalid data chunk manifest");
        }

        var chunkBuffers = new Array(manifest.chunks.length);
        var loadedBytes = 0;
        var nextChunkIndex = 0;
        async function loadNextChunk() {
          while (nextChunkIndex < manifest.chunks.length) {
            var index = nextChunkIndex;
            nextChunkIndex += 1;
            var chunk = manifest.chunks[index];
            var chunkResponse = await fetch(new URL(chunk.file, manifestResponse.url), { cache: "force-cache" });
            if (!chunkResponse.ok) {
              throw new Error("Data chunk request failed: " + chunk.file + " (" + chunkResponse.status + ")");
            }
            var chunkBuffer = await chunkResponse.arrayBuffer();
            if (chunkBuffer.byteLength !== chunk.uncompressedBytes) {
              throw new Error("Data chunk size mismatch: " + chunk.file);
            }
            chunkBuffers[index] = chunkBuffer;
            loadedBytes += chunkBuffer.byteLength;
            onProgress(Math.min(loadedBytes / manifest.uncompressedBytes, 1));
          }
        }

        var chunkWorkers = [];
        var workerCount = Math.min(12, manifest.chunks.length);
        for (var workerIndex = 0; workerIndex < workerCount; workerIndex += 1) {
          chunkWorkers.push(loadNextChunk());
        }
        await Promise.all(chunkWorkers);

        if (loadedBytes !== manifest.uncompressedBytes) {
          throw new Error("Data chunk total size mismatch");
        }
        return URL.createObjectURL(new Blob(chunkBuffers, { type: "application/octet-stream" }));
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        var chunkedDataUrl = null;
        try {
          chunkedDataUrl = await resolveChunkedDataUrl(config.dataUrl, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 50 * progress + "%";
          });
          if (chunkedDataUrl) config.dataUrl = chunkedDataUrl;
        } catch (message) {
          unityShowBanner("Game data loading failed: " + message, "error");
          return;
        }

        var unityPromise = createUnityInstance(canvas, config, (progress) => {
          var percent = chunkedDataUrl ? 50 + 50 * progress : 100 * progress;
          document.querySelector("#unity-progress-bar-full").style.width = percent + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
                document.getElementById("diagnostics-icon").onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
                };
#endif
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

#if DEVELOPMENT_PLAYER
                var profile = unityProfiler.createButton(unityInstance);
                profile.style.marginLeft = '5px';
                document.querySelector("#unity-build-title").appendChild(profile);

                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    unityProfiler.shutDown();
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                unityShowBanner('游戏加载失败：' + message, 'error');
              });
        unityPromise.finally(() => {
          if (chunkedDataUrl) URL.revokeObjectURL(chunkedDataUrl);
        });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
